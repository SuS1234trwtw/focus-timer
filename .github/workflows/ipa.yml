name: IPA

# Builds an unsigned Release .ipa for sideloading (iloader / SideStore re-sign it with your Apple ID)
# and publishes it as a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write  # publish the GitHub Release

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Select latest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch fonts
        run: ./scripts/fetch-fonts.sh

      - name: Write Supabase config
        env:
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          printf 'SUPABASE_HOST = %s\nSUPABASE_ANON_KEY = %s\nSPOTIFY_CLIENT_ID = %s\n' "$SUPABASE_HOST" "$SUPABASE_ANON_KEY" "$SPOTIFY_CLIENT_ID" > Config/Secrets.xcconfig
          # Google redirects to the reversed client ID. Without the secret, Base.xcconfig's placeholder scheme stays.
          if [ -n "$GOOGLE_CLIENT_ID" ]; then
            GOOGLE_REVERSED_CLIENT_ID="com.googleusercontent.apps.${GOOGLE_CLIENT_ID%.apps.googleusercontent.com}"
            printf 'GOOGLE_CLIENT_ID = %s\nGOOGLE_REVERSED_CLIENT_ID = %s\n' "$GOOGLE_CLIENT_ID" "$GOOGLE_REVERSED_CLIENT_ID" >> Config/Secrets.xcconfig
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project FocusTimer.xcodeproj \
            -scheme FocusTimer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build.log

      - name: Check the widget extension is embedded
        run: |
          APP=build/Build/Products/Release-iphoneos/FocusTimer.app
          test -d "$APP/PlugIns/FocusWidgets.appex"
          /usr/libexec/PlistBuddy -c "Print :NSSupportsLiveActivities" "$APP/Info.plist"

      # Unsigned extensions come out of Sideloadly with no provisioning profile, so iOS never runs
      # them (empty Dynamic Island, no widget in the gallery). Ad-hoc sign the extension, then the
      # app, so both carry a code signature and entitlements for the re-signer to replace.
      - name: Ad-hoc sign (extension first)
        run: |
          APP=build/Build/Products/Release-iphoneos/FocusTimer.app
          cat > adhoc.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>application-identifier</key><string>ADHOC.com.focustimer.app</string>
          </dict></plist>
          EOF
          sed 's/com.focustimer.app</com.focustimer.app.widgets</' adhoc.entitlements > widgets.entitlements
          codesign -f -s - --entitlements widgets.entitlements "$APP/PlugIns/FocusWidgets.appex"
          codesign -f -s - --entitlements adhoc.entitlements "$APP"
          codesign -dv "$APP/PlugIns/FocusWidgets.appex"
          codesign -d --entitlements - "$APP/PlugIns/FocusWidgets.appex"

      - name: Package .ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/FocusTimer.app
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          IPA="FocusTimer-$VERSION-$BUILD.ipa"
          zip -qry "$IPA" Payload
          ls -lh "$IPA"
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist"

      - name: Upload .ipa
        uses: actions/upload-artifact@v5
        with:
          name: FocusTimer-ipa
          path: ${{ env.IPA }}
          if-no-files-found: error

      # Every build becomes a GitHub Release with the IPA and a SideStore/AltStore source.
      # releases/latest/download/source.json always serves the newest one: the app's update check and
      # SideStore both read it.
      - name: Write SideStore source
        run: |
          APP=build/Build/Products/Release-iphoneos/FocusTimer.app
          export VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          export BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          export TAG="v$VERSION-$BUILD"
          export SIZE=$(stat -f%z "$IPA")
          export NOTES="$(git log -1 --pretty=%B | grep -v '^Co-Authored-By:' | sed 's/ *\[skip ci\]//')"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          repo = "https://github.com/SuS1234trwtw/focus-timer"
          site = "https://sus1234trwtw.github.io"
          source = {
              "name": "Focus",
              "identifier": "io.github.sus1234trwtw.focus",
              "subtitle": "Pomodoro timer and task list",
              "iconURL": f"{site}/logo.png",
              "website": site + "/",
              "apps": [{
                  "name": "Focus",
                  "bundleIdentifier": "com.focustimer.app",
                  "developerName": "An Le",
                  "subtitle": "Terminal-style Pomodoro timer",
                  "localizedDescription": "A minimal Pomodoro timer and task list with a terminal look, Dynamic Island countdown, optional Spotify now-playing and Google Calendar logging.",
                  "iconURL": f"{site}/logo.png",
                  "tintColor": "#000000",
                  "category": "productivity",
                  "versions": [{
                      "version": os.environ["VERSION"],
                      "buildVersion": os.environ["BUILD"],
                      "date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                      "localizedDescription": os.environ["NOTES"].strip(),
                      "downloadURL": f"{repo}/releases/download/{os.environ['TAG']}/{os.environ['IPA']}",
                      "size": int(os.environ["SIZE"]),
                      "minOSVersion": "26.0",
                  }],
                  "appPermissions": {"entitlements": [], "privacy": {}},
              }],
              "news": [],
          }
          with open("source.json", "w") as f:
              json.dump(source, f, indent=2)
          PY
          cat source.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n\nHow to install: https://sus1234trwtw.github.io/install.html\n' "$(git log -1 --pretty=%B | grep -v '^Co-Authored-By:' | sed 's/ *\[skip ci\]//')" > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" source.json --clobber
          else
            gh release create "$TAG" "$IPA" source.json --target "$GITHUB_SHA" \
              --title "Focus $VERSION ($BUILD)" --notes-file notes.md --latest
          fi

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ipa-build-log
          path: build.log
