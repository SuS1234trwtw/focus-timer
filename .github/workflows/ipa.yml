name: IPA

# Builds an unsigned Release .ipa for sideloading (Sideloadly / AltStore re-sign it with your Apple ID).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Select latest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch fonts
        run: ./scripts/fetch-fonts.sh

      - name: Write Supabase config
        env:
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: |
          printf 'SUPABASE_HOST = %s\nSUPABASE_ANON_KEY = %s\nSPOTIFY_CLIENT_ID = %s\n' "$SUPABASE_HOST" "$SUPABASE_ANON_KEY" "$SPOTIFY_CLIENT_ID" > Config/Secrets.xcconfig

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project FocusTimer.xcodeproj \
            -scheme FocusTimer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build.log

      - name: Check the widget extension is embedded
        run: |
          APP=build/Build/Products/Release-iphoneos/FocusTimer.app
          test -d "$APP/PlugIns/FocusWidgets.appex"
          /usr/libexec/PlistBuddy -c "Print :NSSupportsLiveActivities" "$APP/Info.plist"

      - name: Package .ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/FocusTimer.app
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          IPA="FocusTimer-$VERSION-$BUILD.ipa"
          zip -qry "$IPA" Payload
          ls -lh "$IPA"
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist"

      - name: Upload .ipa
        uses: actions/upload-artifact@v5
        with:
          name: FocusTimer-ipa
          path: ${{ env.IPA }}
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ipa-build-log
          path: build.log
