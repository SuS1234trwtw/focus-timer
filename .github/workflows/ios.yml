name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Select latest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch fonts
        run: ./scripts/fetch-fonts.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if "iOS-26" in k), reverse=True)
          print(next(d["udid"] for k in runtimes for d in devices[k] if d["name"].startswith("iPhone")))
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project FocusTimer.xcodeproj \
            -scheme FocusTimer \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            | tee xcodebuild.log | grep -E "error:|warning: .*FocusTimer/|Test (Suite|case)|✔|✘|\*\* (TEST|BUILD)" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild.log

      - name: Screenshots
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          APP=build/Build/Products/Debug-iphonesimulator/FocusTimer.app
          mkdir -p screenshots
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryLevel 100 --cellularBars 4
          xcrun simctl uninstall "$UDID" com.focustimer.app || true
          xcrun simctl install "$UDID" "$APP"
          # 1) focus mode with sample tasks
          xcrun simctl launch "$UDID" com.focustimer.app -seedDemo
          sleep 8
          xcrun simctl io "$UDID" screenshot screenshots/1-focus.png
          # 2) run a 10s focus block to completion -> break mode
          xcrun simctl terminate "$UDID" com.focustimer.app
          xcrun simctl launch "$UDID" com.focustimer.app -fastTimer -autostart
          sleep 14
          xcrun simctl io "$UDID" screenshot screenshots/2-break.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: screenshots

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: xcodebuild-logs
          path: |
            xcodebuild.log
            TestResults.xcresult
          if-no-files-found: ignore
