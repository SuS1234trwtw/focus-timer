name: FocusTimer

options:
  bundleIdPrefix: com.focustimer
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"

targets:
  FocusTimer:
    type: application
    platform: iOS
    sources:
      - path: FocusTimer
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    dependencies:
      - package: Supabase
    info:
      path: FocusTimer/Info.plist
      properties:
        CFBundleDisplayName: Focus
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - JetBrainsMono-Light.ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Bold.ttf
        SUPABASE_HOST: $(SUPABASE_HOST)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focustimer.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES

  FocusTimerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FocusTimerTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FocusTimer

schemes:
  FocusTimer:
    build:
      targets:
        FocusTimer: all
        FocusTimerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FocusTimerTests
